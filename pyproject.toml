[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "python-service-foundation"
version = "0.3.0"
description = "A minimal Python project with engineering knowledge for feature-driven backends"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "hatchling>=1.27,<2",
    "pyrefly>=1.2,<2",
    "pytest>=9.1,<10",
    "ruff>=0.16,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "knowledge", "AGENTS.md", "CLAUDE.md", "justfile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyrefly]
project-includes = ["src", "tests", "scripts"]
use-ignore-files = false
disable-project-excludes-heuristics = true
python-version = "3.14"
preset = "strict"
