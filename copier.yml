_min_copier_version: "9.18.1"
_subdirectory: template

project_name:
  type: str
  help: Human-readable name for the new service.
  default: "{{ _copier_conf.dst_path.name }}"

project_slug:
  type: str
  help: Python package identifier for the new service (lowercase letters, digits, underscores).
  default: "{{ project_name | lower | replace(' ', '_') | replace('-', '_') }}"
  validator: "{% if not project_slug.isidentifier() or not project_slug.islower() %}Use a lowercase Python identifier with letters, digits, and underscores.{% endif %}"

use_postgres:
  type: bool
  help: Include the first-party async PostgreSQL profile (SQLAlchemy, asyncpg, and Alembic).
  default: true
