name: Template smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  render-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: scripts/smoke-template.sh
