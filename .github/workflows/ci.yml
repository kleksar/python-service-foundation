name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          python-version: "3.14"
          enable-cache: true
      - name: Install locked project
        run: uv sync --locked
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Check types
        run: uv run pyrefly check
      - name: Test package and knowledge
        run: uv run pytest
      - name: Check built distribution
        run: uv run python scripts/check_package.py
